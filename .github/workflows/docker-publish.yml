name: Publicar imagen Docker (GHCR)

# Construye y publica la imagen en ghcr.io/diegoparras/escriba. No requiere secretos extra
# (usa el GITHUB_TOKEN).
#  - push a main          -> tags :latest + :X.Y.Z (del archivo VERSION) + :sha-xxxxxxx, y
#                            Release vX.Y.Z con las notas de esa version del CHANGELOG.md
#  - tag vX.Y.Z           -> tag :vX.Y.Z (como antes)
# Cada version dice que cambia: sin su seccion en el CHANGELOG el build no sale.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

# Evita que el build de "main" y el de un "tag" corran a la vez (los dos bajaban
# el modelo de HuggingFace en paralelo → 429). Se serializan y el 2º usa la cache.
concurrency:
  group: ghcr-publish
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # crear el tag y el Release de la version
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version y novedades (VERSION + CHANGELOG)
        id: ver
        run: |
          V="$(python3 -m app.novedades --version)"
          python3 -m app.novedades notas > "$RUNNER_TEMP/notas.md"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          {
            echo "## Escriba v$V"
            echo
            cat "$RUNNER_TEMP/notas.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login en GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata (tags y labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.ver.outputs.version }},enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short
          labels: |
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}

      - name: Build & push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Release de la version
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "::warning::La v$V ya estaba publicada: este deploy no subio la version (patch) ni sumo novedades."
          else
            gh release create "v$V" --target "$GITHUB_SHA" --title "Escriba v$V" --notes-file "$RUNNER_TEMP/notas.md"
          fi
